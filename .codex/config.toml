[mcp_servers.codehive]
command = "npx"
args = ["tsx", "/home/arieltoledo/Development/codehive/mcp/server.ts"]
enabled = true

[mcp_servers.codehive.tools.agent_register]
approval_mode = "approve"

[mcp_servers.codehive.tools.chat_read]
approval_mode = "approve"

